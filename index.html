<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>學生闖關任務</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* 🌟 1. 鎖死最外層，強制滿版且絕對禁止滑動 */
    html, body { 
      background-color: #f4f9f4; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; 
      margin: 0; padding: 0; 
      width: 100vw; height: 100vh; 
      overflow: hidden; 
      touch-action: none; 
      -webkit-user-select: none; user-select: none; 
      display: flex; align-items: center; justify-content: center; 
    }
    input { user-select: auto !important; -webkit-user-select: auto !important; }
    
    /* 🌟 2. 遊戲容器動態滿版，但在電腦上保留合理的極限寬度 */
    .game-wrapper { 
      width: 100%; height: 100%; max-width: 1000px; padding: 10px; box-sizing: border-box; 
      display: flex; flex-direction: column; justify-content: center; 
    }
    
    /* 🌟 3. 卡片內部設定：確保內容不會衝破螢幕 */
    .card { 
      border-radius: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.08); border: none; margin: 0; width: 100%; 
      max-height: 95vh; display: flex; flex-direction: column; 
    }
    .card-body { overflow-y: auto; }

    .header-bar { color: white; border-radius: 20px 20px 0 0; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; flex-shrink: 0; }
    .header-login { background-color: #f7a072; }
    .header-result { background-color: #6c9a75; }
    .table-responsive { max-height: 40vh; overflow-y: auto; touch-action: pan-y; }
    
    .login-rank-item { background: #fdfbf7; border: 1px solid #f0e6d2; border-radius: 10px; padding: 8px 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .login-rank-1 { background: #fffdf0; border-color: #fce883; box-shadow: 0 2px 5px rgba(252, 232, 131, 0.3); }
    .login-rank-2 { background: #f8f9fa; border-color: #e2e3e5; }
    .login-rank-3 { background: #fff5ee; border-color: #f5d0b5; }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div id="step-login" class="card pb-3">
      <div class="header-bar header-login">🚀 準備挑戰任務！</div>
      <div class="card-body px-4">
        <div class="text-center mb-4 mt-2">
          <h5 class="fw-bold" id="gameTitleDisplay">讀取任務中...</h5>
          <span class="badge bg-secondary" id="gameModeDisplay"></span>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">姓名 / 暱稱</label>
          <input type="text" id="sName" class="form-control form-control-lg" placeholder="請輸入你的名字">
        </div>
        <button class="btn btn-lg w-100 fw-bold text-white mb-4" style="background-color: #f7a072; border-radius: 12px; box-shadow: 0 4px 0 #e67e22;" id="startBtn" onclick="startGame()" disabled>開始測驗</button>
        <div class="pt-3 border-top">
          <h6 class="fw-bold text-muted mb-3 text-center" style="font-size: 0.95rem;">🏆 目前前三名英雄榜</h6>
          <div id="loginLeaderboard"><div class="text-center text-muted small py-2">讀取中...</div></div>
        </div>
      </div>
    </div>

    <div id="game-container"></div>

    <div id="step-result" class="card d-none">
      <div class="header-bar header-result">🎉 挑戰完成！</div>
      <div class="card-body text-center p-4">
        <h3 class="fw-bold mt-2">你的分數</h3>
        <h1 class="display-1 fw-bold text-success mb-0" id="finalScoreDisplay">0</h1>
        <p class="text-muted mt-2 mb-4">花費時間：<span id="finalTimeDisplay"></span> 秒</p>
        <h5 class="fw-bold mb-3 border-bottom pb-2 text-start">🏆 任務總排行榜</h5>
        <div class="table-responsive">
          <table class="table table-sm table-striped align-middle text-start">
            <thead><tr><th>名次</th><th>姓名</th><th>分數</th><th>時間</th></tr></thead>
            <tbody id="leaderboardBody"><tr><td colspan="4" class="text-center py-3">結算中...</td></tr></tbody>
          </table>
        </div>
        <button class="btn btn-outline-secondary w-100 mt-3" onclick="restartGame()">↺ 再玩一次</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 🌟 已幫妳自動填入妳的 GAS 網址！
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw4MFx9qi8URQ2MHp10LbHTn4VwMd5w29VoI7N33fAb8shyhrpSGbNmpHgGGrRVij8c/exec"; 
    
    const urlParams = new URLSearchParams(window.location.search);
    const GAME_ID = urlParams.get('gameId');

    let globalGameData = {}; let globalQuestions = []; let currentMode = "";
    let globalTimer = 0; let globalTimerInterval = null; let currentSpeechRate = 0.85; 

    const moduleFiles = {
      "選擇題": "Game_MC.html",
      "翻牌記憶": "Game_Memory.html",
      "猜字謎": "Game_Anagram.html",
      "打地鼠": "Game_WhackAMole.html",
      "重組句子": "Game_Unjumble.html"
    };

    function speakWord(text) {
      if (!text || text === 'undefined') return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'en-US'; msg.rate = currentSpeechRate; msg.pitch = 1.0;    
        window.speechSynthesis.speak(msg);
      }
    }

    function injectHTML(containerId, htmlContent) {
      const container = document.getElementById(containerId);
      container.innerHTML = htmlContent;
      Array.from(container.querySelectorAll("script")).forEach(oldScript => {
        const newScript = document.createElement("script");
        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      if(!GAME_ID) { document.getElementById('gameTitleDisplay').innerText = "❌ 缺少任務代碼"; return; }
      
      fetch(`${GAS_API_URL}?action=getQuestions&gameId=${GAME_ID}`)
        .then(res => res.json())
        .then(res => {
          if(res.error) {
            document.getElementById('gameTitleDisplay').innerText = res.error; 
            document.getElementById('gameTitleDisplay').classList.add('text-danger');
          } else {
            globalGameData = res; globalQuestions = res.questions; currentMode = res.mode; 
            document.getElementById('gameTitleDisplay').innerText = res.title;
            let displayMode = res.mode;
            if (res.qType && res.optType) { displayMode += ` (${res.qType} ➔ ${res.optType})`; }
            document.getElementById('gameModeDisplay').innerText = "模式：" + displayMode;
            
            let targetFile = moduleFiles[currentMode];
            if (targetFile) {
              fetch(targetFile)
                .then(htmlRes => htmlRes.text())
                .then(htmlContent => {
                  injectHTML("game-container", htmlContent);
                  document.getElementById('startBtn').disabled = false;
                });
            } else {
              document.getElementById('gameTitleDisplay').innerText = "⚠️ 找不到此遊戲模組"; 
            }
          }
        }).catch(err => {
          document.getElementById('gameTitleDisplay').innerText = "連線異常，請重新整理"; 
        });
        
      fetchLoginLeaderboard();
    });

    function fetchLoginLeaderboard() {
      document.getElementById('loginLeaderboard').innerHTML = '<div class="text-center text-muted small py-2">讀取中...</div>';
      fetch(`${GAS_API_URL}?action=getRecords&gameId=${GAME_ID}`)
      .then(res => res.json()).then(res => {
        let lbDiv = document.getElementById('loginLeaderboard'); lbDiv.innerHTML = '';
        if(!res.records || res.records.length === 0) {
           lbDiv.innerHTML = '<div class="text-center text-muted small py-2" style="background: #f8f9fa; border-radius: 8px;">目前還沒有人挑戰，搶下第一名吧！</div>'; return;
        }
        res.records.slice(0, 3).forEach((r, idx) => {
           let medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : '🥉';
           let extraClass = idx === 0 ? 'login-rank-1' : idx === 1 ? 'login-rank-2' : 'login-rank-3';
           lbDiv.innerHTML += `<div class="login-rank-item ${extraClass}"><span style="font-size:1.1rem;">${medal} <span class="fw-bold ms-1" style="color:#555;">${r.name}</span></span><span class="fw-bold" style="color:#e67e22;">${r.score} <small class="text-muted" style="font-size:0.8rem; font-weight:normal;">(${r.timeSpent}s)</small></span></div>`;
        });
      });
    }

    function startGame() {
      let name = document.getElementById('sName').value.trim();
      if(!name) { alert("請輸入名字喔！"); return; }
      document.getElementById('step-login').classList.add('d-none');
      globalTimer = 0;
      globalTimerInterval = setInterval(() => { globalTimer++; document.dispatchEvent(new CustomEvent('timerUpdated', { detail: globalTimer })); }, 1000);

      if (currentMode === "選擇題") { initGame_MC(globalQuestions); } 
      else if (currentMode === "翻牌記憶") { initGame_Memory(globalQuestions); } 
      else if (currentMode === "猜字謎") { initGame_Anagram(globalQuestions); } 
      else if (currentMode === "打地鼠") { initGame_WhackAMole(globalQuestions); }
      else if (currentMode === "重組句子") { initGame_Unjumble(globalQuestions); }
    }

    function finishGame(score) {
      clearInterval(globalTimerInterval);
      document.querySelectorAll('.game-module').forEach(el => el.classList.add('d-none'));
      document.getElementById('step-result').classList.remove('d-none');
      document.getElementById('finalScoreDisplay').innerText = score;
      document.getElementById('finalTimeDisplay').innerText = globalTimer;
      let name = document.getElementById('sName').value.trim();
      
      fetch(`${GAS_API_URL}?action=submitScore&gameId=${GAME_ID}&sName=${encodeURIComponent(name)}&score=${score}&timeSpent=${globalTimer}`)
      .then(res => res.json()).then(res => {
        renderLeaderboard(res.records, name, globalTimer);
      });
    }

    function renderLeaderboard(records, currentName, currentTime) {
      let tbody = document.getElementById('leaderboardBody'); tbody.innerHTML = ''; let foundMe = false; 
      records.forEach((r, idx) => {
        let medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : (idx+1);
        let isMe = (r.name === currentName && r.timeSpent === currentTime && !foundMe);
        let rowClass = isMe ? 'table-warning fw-bold' : ''; if(isMe) foundMe = true; 
        tbody.innerHTML += `<tr class="${rowClass}"><td class="fw-bold text-center">${medal}</td><td>${r.name} ${isMe ? '<span class="badge bg-danger ms-1">You</span>' : ''}</td><td class="text-success fw-bold">${r.score}</td><td class="text-muted">${r.timeSpent}s</td></tr>`;
      });
    }

    document.addEventListener('resetTimerRequest', function() { globalTimer = 0; });
    function restartGame() {
      document.getElementById('step-result').classList.add('d-none'); document.getElementById('step-login').classList.remove('d-none');
      document.querySelectorAll('.game-module').forEach(el => el.classList.add('d-none'));
      document.getElementById('finalScoreDisplay').innerText = "0"; document.getElementById('finalTimeDisplay').innerText = "0";
      clearInterval(globalTimerInterval); globalTimer = 0; 
      fetchLoginLeaderboard();
    }
  </script>
</body>
</html>
