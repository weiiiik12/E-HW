<style>
  #module-mc { 
    background-color: #f4f9f4; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
    width: 100%; height: 100%; /* 填滿外層卡片 */
    display: flex; flex-direction: column; /* 垂直排版 */
    border: 4px solid #fff; overflow: hidden; 
  }
  .mc-header { 
    background: linear-gradient(135deg, #6c9a75 0%, #4a7c59 100%); color: white; 
    padding: 10px 20px; display: flex; justify-content: space-between; 
    font-weight: 900; font-size: 1.2rem; 
    flex-shrink: 0; /* 標題區絕對不准縮小 */
  }
  
  .mc-target-area { 
    background: #fff; margin: 15px 20px; padding: 15px; border-radius: 15px; 
    text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); 
    flex-shrink: 0; /* 題目區絕對不准縮小 */
  }
  .mc-target-text { font-size: 2.5rem; font-weight: bold; color: #2d3436; }
  .mc-target-image { max-height: 140px; max-width: 100%; object-fit: contain; border-radius: 12px; }
  .mc-target-audio { font-size: 3.5rem; cursor: pointer; animation: pulse 2s infinite; margin-bottom: 5px; }
  @keyframes pulse { 0% { transform: scale(0.95); } 50% { transform: scale(1.05); } 100% { transform: scale(0.95); } }

  .mc-speed-box {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: rgba(255, 255, 255, 0.9); padding: 5px 15px; border-radius: 20px;
    margin: 0 auto 10px auto; width: fit-content;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); border: 2px dashed #6c9a75; 
    flex-shrink: 0; /* 滑桿區絕對不准縮小 */
  }
  .mc-speed-box input[type=range] { width: 110px; touch-action: pan-x !important; accent-color: #6c9a75; cursor: pointer; }
  .mc-speed-box span { font-weight: 900; color: #6c9a75; font-size: 1rem; }
  
  /* 🌟 選項區域：彈性拿取剩餘空間，裝不下就自己滑動 */
  .mc-options-container { 
    flex: 1 1 auto; /* 填滿剩餘的所有高度 */
    min-height: 0; /* 🌟 救命魔法：防止外框被撐破，允許內部正常產生捲軸 */
    overflow-y: auto; /* 允許內部捲動 */
    padding: 0 20px 20px 20px;
    
    display: grid; 
    grid-template-columns: 1fr; /* 手機預設：直排 1 欄 */
    gap: 12px; 
    align-content: start; /* 選項靠上對齊，不要硬拉長 */
  }
  
  /* 🌟 當螢幕寬度大於 768px (橫式平板、電腦)，自動切換成 2x2 雙排 */
  @media (min-width: 768px) {
    .mc-options-container { grid-template-columns: 1fr 1fr; gap: 15px; }
  }

  .mc-option-btn { 
    background: white; border: 3px solid #e0e0e0; border-radius: 12px; padding: 10px; 
    font-size: 1.3rem; font-weight: bold; color: #444; transition: all 0.2s; cursor: pointer; 
    display: flex; align-items: center; justify-content: center; 
    box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
    min-height: 80px; /* 給按鈕一個合理的基本高度，絕對不准再被壓扁 */
  }
  .mc-option-btn:active { transform: translateY(2px); box-shadow: 0 2px 3px rgba(0,0,0,0.05); }
  .mc-option-btn.correct { background: #e8f5e9; border-color: #6c9a75; color: #2e7d32; }
  .mc-option-btn.wrong { background: #ffebee; border-color: #ff7675; color: #d63031; animation: shake 0.4s; }
  
  .mc-option-img { 
    max-height: 90px; /* 限制圖片高度，絕對不撐破按鈕 */
    max-width: 100%; 
    object-fit: contain; 
    border-radius: 8px; 
  }

  /* 🌟 手機專用瘦身設定，節省小螢幕空間 */
  @media (max-width: 500px) {
    .mc-target-area { margin: 10px 15px; padding: 10px; }
    .mc-target-image { max-height: 100px; } 
    .mc-target-text { font-size: 2rem; }
    .mc-target-audio { font-size: 3rem; margin-bottom: 0; }
    .mc-options-container { padding: 0 15px 15px 15px; gap: 10px; }
    .mc-option-btn { min-height: 60px; padding: 5px; }
    .mc-option-img { max-height: 70px; }
  }
</style>

<div id="module-mc" class="card d-none game-module">
  <div class="mc-header">
    <span>🎯 第 <span id="mc-progressText">1 / 10</span> 題</span>
    <span>⏱️ <span id="mc-timerText">0</span> 秒</span>
  </div>
  
  <div class="mc-target-area" id="mc-targetArea"></div>

  <div class="mc-speed-box" id="mc-speed-box-container">
    <span id="mc-speed-icon">🐇</span>
    <input type="range" min="0.3" max="1.0" step="0.05" value="0.85" oninput="changeMCSpeed(this.value)">
    <span id="mc-speed-text">0.85x</span>
  </div>
  
  <div class="mc-options-container" id="mc-optionsArea"></div>
</div>

<script>
  let mc_questions = [];
  let mc_currentIndex = 0;
  let mc_isLocked = false;
  let mc_mistakes = 0; 
  let mc_score = 100;

  const sfxClick = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3');
  const sfxCorrect = new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3');
  const sfxWrong = new Audio('https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3');

  document.addEventListener('timerUpdated', function(e) { let timerEl = document.getElementById('mc-timerText'); if(timerEl) timerEl.innerText = e.detail; });

  function changeMCSpeed(val) {
    if (typeof currentSpeechRate !== 'undefined') currentSpeechRate = parseFloat(val); 
    document.getElementById('mc-speed-text').innerText = parseFloat(val).toFixed(2) + 'x';
    let icon = '🐇'; if (val <= 0.45) icon = '🐌'; else if (val < 0.8) icon = '🐢';
    document.getElementById('mc-speed-icon').innerText = icon;
  }

  function playMCAudio(url, fallbackWord) {
    if(url && url !== 'undefined' && url !== '') { 
      let audio = new Audio(url); 
      if (typeof currentSpeechRate !== 'undefined') audio.playbackRate = currentSpeechRate;
      audio.play().catch(() => speakWord(fallbackWord)); 
    } else { speakWord(fallbackWord); }
  }

  function initGame_MC(questions) {
    document.getElementById('module-mc').classList.remove('d-none');
    mc_questions = questions; mc_currentIndex = 0; mc_score = 100; mc_mistakes = 0;
    
    document.getElementById('mc-speed-box-container').style.display = 'flex';
    renderMCQuestion();
  }

  function renderMCQuestion() {
    mc_isLocked = false;
    let q = mc_questions[mc_currentIndex];
    let qType = globalGameData.qType || 'english';
    let optType = globalGameData.optType || 'chinese';
    
    document.getElementById('mc-progressText').innerText = (mc_currentIndex + 1) + " / " + mc_questions.length;

    let targetHtml = "";
    if (qType === 'audio') {
      targetHtml = `<div class="mc-target-audio" onclick="playMCAudio('${q.target.audioUrl}', '${q.target.english}')">🔊</div><div style="font-size: 0.9rem; color: #636e72; margin-top: 5px;">點擊可聽發音</div>`;
    } else if (qType === 'image') {
      targetHtml = q.target.imageUrl ? `<img src="${q.target.imageUrl}" class="mc-target-image" onclick="playMCAudio('${q.target.audioUrl}', '${q.target.english}')"><div style="font-size: 0.9rem; color: #636e72; margin-top: 5px;">點圖可聽發音</div>` : `<div class="mc-target-text">無圖片</div>`;
    } else if (qType === 'chinese') {
      targetHtml = `<div class="mc-target-text" onclick="playMCAudio('${q.target.audioUrl}', '${q.target.english}')">${q.target.chinese}</div><div style="font-size: 0.9rem; color: #636e72; margin-top: 5px;">點字可聽發音</div>`;
    } else {
      targetHtml = `<div class="mc-target-text" onclick="playMCAudio('${q.target.audioUrl}', '${q.target.english}')">${q.target.english}</div><div style="font-size: 0.9rem; color: #636e72; margin-top: 5px;">點字可聽發音</div>`;
    }
    document.getElementById('mc-targetArea').innerHTML = targetHtml;

    if (qType === 'audio') setTimeout(() => playMCAudio(q.target.audioUrl, q.target.english), 500);

    let optionsHtml = "";
    q.options.forEach((opt, idx) => {
      let content = "";
      if (optType === 'image') content = opt.imageUrl ? `<img src="${opt.imageUrl}" class="mc-option-img">` : "無圖";
      else if (optType === 'chinese') content = opt.chinese;
      else content = opt.english;
      optionsHtml += `<div class="mc-option-btn" id="mc-opt-${idx}" onclick="checkMCAnswer(${idx}, '${opt.english}', '${q.target.english}')">${content}</div>`;
    });
    document.getElementById('mc-optionsArea').innerHTML = optionsHtml;
  }

  function checkMCAnswer(idx, selectedEnglish, targetEnglish) {
    if (mc_isLocked) return;
    mc_isLocked = true;
    let btn = document.getElementById(`mc-opt-${idx}`);

    if (selectedEnglish === targetEnglish) {
      sfxCorrect.currentTime = 0; sfxCorrect.play().catch(()=>{});
      btn.classList.add('correct');
      setTimeout(() => {
        mc_currentIndex++;
        if (mc_currentIndex < mc_questions.length) { renderMCQuestion(); } 
        else { finishGame(Math.max(0, mc_score)); }
      }, 800);
    } else {
      sfxWrong.currentTime = 0; sfxWrong.play().catch(()=>{});
      mc_mistakes++; mc_score -= 5;
      btn.classList.add('wrong');
      setTimeout(() => { btn.classList.remove('wrong'); mc_isLocked = false; }, 800);
    }
  }
</script>
